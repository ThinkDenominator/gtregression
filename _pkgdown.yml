articles:
  - title: "Get started"
    desc: "A complete analysis from data to manuscript, and how to pick the right function."
    contents:
      - gtregression-intro
      - choose-model
      - function-options

  - title: "Tables"
    desc: "Descriptive summaries, regression tables, special study designs and absolute effects."
    contents:
      - descriptive-tables
      - regression-tables
      - special-models
      - risk-difference
      - stratified-analysis

  - title: "Survival"
    desc: "Kaplan-Meier curves, survival summaries, Cox and parametric models, and predictions."
    contents:
      - survival-analysis

  - title: "Interpret"
    desc: "Confounding, interaction, mediation, diagnostics and model selection."
    contents:
      - confounding-interaction
      - causal-mediation
      - diagnostics-selection

  - title: "Output"
    desc: "Plots, forest plots, merged tables and export to Word, HTML and images."
    contents:
      - visualise-results
      - merge-tables
      - customize-export

  - title: "App"
    desc: "The menu-driven interface for the same analyses."
    contents:
      - gtregression-app

reference:
  - title: "Prepare and describe data"
    desc: "Import data, check variables before modelling, and build baseline tables."
    contents:
      - import_data
      - dissect
      - descriptive_table

  - title: "Regression tables"
    desc: "Crude and adjusted estimates for binary, count and continuous outcomes."
    contents:
      - uni_reg
      - multi_reg

  - title: "Special study designs"
    desc: "Matched case-control, clustered, ordered and unordered outcomes."
    contents:
      - conditional_logit_reg
      - multilevel_reg
      - ordinal_reg
      - multinomial_reg

  - title: "Absolute effects"
    desc: "Absolute risks, risk difference and NNTB/NNTH for two-group comparisons."
    contents:
      - risk_difference

  - title: "Stratified analysis"
    desc: "The same model repeated within each level of a stratifier."
    contents:
      - stratified_uni_reg
      - stratified_multi_reg

  - title: "Survival: describe and compare"
    desc: "Kaplan-Meier and cumulative incidence curves, summaries and tests."
    contents:
      - km_plot
      - km_risk_table
      - survival_summary
      - survival_quantiles
      - survival_prob
      - rmst_table
      - logrank_test
      - cuminc_plot

  - title: "Survival: models"
    desc: "Cox, parametric and competing-risk regression, with checks and predictions."
    contents:
      - cox_reg
      - surv_reg
      - competing_risk_reg
      - check_ph
      - plot.gtregression_ph
      - plot_cox_survival
      - surv_model_compare
      - plot_surv_fit
      - surv_predict

  - title: "Plots and forest plots"
    desc: "Visualise estimates from one or two regression results."
    contents:
      - plot_reg
      - plot_reg_combine
      - forest_df
      - forest_reg

  - title: "Diagnostics and model choice"
    desc: "Convergence, collinearity, fit, and comparison of candidate models."
    contents:
      - check_convergence
      - check_collinearity
      - plot_model_fit
      - compare_models
      - select_models

  - title: "Confounding, interaction and mediation"
    desc: "Support causal interpretation of an exposure-outcome association."
    contents:
      - identify_confounder
      - interaction_models
      - mediation_analysis
      - plot_mediation

  - title: "Customise, merge and export"
    desc: "Relabel tables, combine them, and save tables, plots and Word reports."
    contents:
      - modify_table
      - merge_tables
      - save_table
      - save_docx
      - save_plot
      - save_forest

  - title: "Graphical interface"
    desc: "Run the same analyses from menus."
    contents:
      - gtregression_app
      - gtregression_addin

  - title: "Working with results"
    desc: "Inspect and print the objects returned by gtregression functions."
    contents:
      - "$.gtregression"
      - print.gtregression

  - title: "Example datasets"
    desc: "Datasets used in the examples and guides."
    contents:
      - data_birthwt
      - data_SynthDiabetes
      - data_gt_quin
      - data_epilepsy
      - data_endometrial
      - data_diabetes_mediation
      - data_competing_risk
      - data_infertility
      - data_lungcancer
