url: https://gtregression.thinkdenominator.com/
template:
  bootstrap: 5
  light-switch: false
  bslib:
    primary: "#0F6F73"
    link-color: "#0F6F73"
    body-color: "#1B2530"
    border-radius: "0.5rem"
    font-size-base: "1rem"
  logo: man/figures/gtregression_hex.png
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
      <link rel="stylesheet" href="https://thinkdenominator.com/analytics-consent.css">
      <script>window.TD_GA_MEASUREMENT_ID = "G-3DE4ZZV06B";</script>
      <script defer src="https://thinkdenominator.com/analytics-consent.js"></script>

